server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: loan-service

# Local default: localhost:8081. Override with an env var in Kubernetes:
#   CUSTOMER_SERVICE_URL=http://customer-service   (Service name -> CoreDNS)
customer-service:
  url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
  timeout-ms: ${CUSTOMER_SERVICE_TIMEOUT_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # exposes /actuator/health/liveness and /actuator/health/readiness
