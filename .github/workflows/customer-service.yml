name: loan-service
on:
  push:
    branches: [main]
    paths: ["customer-service/**"]

permissions:
  contents: write
  packages: write

env:
  SERVICE: customer-service
  IMAGE: ghcr.io/${{ github.repository_owner }}/loan-service

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }

      - name: Test
        run: mvn -B -f $SERVICE/pom.xml verify

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Bump image tag in deploy/
        run: |
          cd deploy
          kustomize edit set image $SERVICE=$IMAGE:${{ github.sha }}
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "deploy: $SERVICE ${GITHUB_SHA::7}"
          git pull --rebase && git push